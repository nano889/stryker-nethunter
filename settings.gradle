pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        // NetHunter port: jcenter() and jcenter.bintray.com removed. Bintray was
        // shut down in 2021 and the host no longer resolves, so leaving them in
        // made every dependency resolution attempt a dead lookup. Everything
        // this project needs (including jcifs 1.3.17) is on mavenCentral.
    }
}
rootProject.name = "Stryker"
include ':app'

include ':terminal'
include ':chrome-tabs'
include ':NeoLang'
include ':Xorg'
include ':NeoTermBridge'
