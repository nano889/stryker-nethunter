org.gradle.jvmargs=-Xmx4608m
android.useAndroidX=true
android.enableJetifier=true
# NetHunter port: configuration cache disabled. AGP 8.13 + the kotlin-android
# plugin used by :terminal are not fully configuration-cache compatible, and a
# cache miss there fails the build rather than just slowing it down.
org.gradle.unsafe.configuration-cache=false
android.nonTransitiveRClass=false
android.defaults.buildfeatures.buildconfig=true
