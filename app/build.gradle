plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zalexdev.stryker'
    // NetHunter port: 36, not 37. AGP 8.13.2 supports up to API 36; API 37
    // requires AGP 9.1.1+, which conflicts with the kotlin-android plugin this
    // project uses. Nothing in the port depends on 37.
    compileSdk 36
    // NetHunter port: the NDK is no longer required for :app. The only native
    // module this module compiled itself was libprotected.so (jni/protected.c +
    // neigh.c); the prebuilt arm64-v8a copy that ships in the upstream APK is
    // checked into src/main/jniLibs/arm64-v8a/, so :app no longer needs an NDK.
    // NOTE: the :terminal module still compiles C++ via CMake and does need it.
    // ndkVersion '25.1.8937393'

    defaultConfig {
        applicationId "com.zalexdev.stryker"
        minSdk 24
        targetSdk 36
        versionCode 651
        versionName "6.5.1"

        ndk {
            abiFilters 'arm64-v8a'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def storeFilePath = project.findProperty('STRYKER_RELEASE_STORE_FILE') ?: System.getenv('STRYKER_RELEASE_STORE_FILE')
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword project.findProperty('STRYKER_RELEASE_STORE_PASSWORD') ?: System.getenv('STRYKER_RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('STRYKER_RELEASE_KEY_ALIAS') ?: System.getenv('STRYKER_RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('STRYKER_RELEASE_KEY_PASSWORD') ?: System.getenv('STRYKER_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.findProperty('STRYKER_RELEASE_STORE_FILE') || System.getenv('STRYKER_RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }

        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig = true
    }

    // NetHunter port: externalNativeBuild removed for :app — libprotected.so is
    // prebuilt in src/main/jniLibs/arm64-v8a/ (see the note at the top).
    // externalNativeBuild {
    //     ndkBuild {
    //         path 'src/main/jni/Android.mk'
    //     }
    // }

    packagingOptions {
        resources.excludes.add("META-INF/*")

        jniLibs.useLegacyPackaging = true

        jniLibs.keepDebugSymbols += [
                "**/libqemu.so",
                "**/libslirp.so",
                "**/libuml.so",
                "**/libstub.so",
                "**/libumnet.so",
                "**/libpasst.so",
                "**/libumusb.so",
                "**/libbash.so",
        ]
    }

    aaptOptions {
        // NetHunter port: "xz" added — the Kali rootfs is .tar.xz and must stay
        // uncompressed inside the APK so the extractor can stream it.
        noCompress "tar.gz", "gz", "xz", "imgz", "db", "sqlite", "img", "so", "qemu-system-aarch64", "Image"
    }

    lint {
        baseline = file("lint-baseline.xml")
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'androidx.work:work-runtime:2.12.0'

    implementation 'com.github.cachapa:ExpandableLayout:2.9.2'
    implementation 'com.airbnb.android:lottie:6.7.1'
    implementation 'com.github.seancfoley:ipaddress:5.6.2'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'com.facebook.shimmer:shimmer:0.5.0@aar'
    implementation 'jcifs:jcifs:1.3.17'
    implementation 'commons-net:commons-net:3.13.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'
    implementation 'commons-codec:commons-codec:1.22.1'
    // NetHunter port: okhttp 5.5.0 -> 5.4.0. okhttp-android 5.5.0 declares
    // minCompileSdk=37 in its AAR metadata, which fails :app:checkDebugAarMetadata
    // against compileSdk 36. 5.4.0 declares minCompileSdk=36 and is API-compatible
    // with every call site here (OkHttpClient/Request/Response/ResponseBody).
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'com.getkeepsafe.taptargetview:taptargetview:1.15.0'
    implementation 'com.nambimobile.widgets:expandable-fab:1.2.1'
    implementation 'com.github.mwiede:jsch:2.28.7'

    implementation project(':terminal')
    implementation project(':NeoTermBridge')
}
